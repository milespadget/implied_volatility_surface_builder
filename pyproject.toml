[project]
name = "ivsurface"
version = "0.1.0"
description = "Implied volatility surfaces from Deribit option chains: Black-76 inversion, interpolation and SVI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]
